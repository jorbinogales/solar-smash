# Despliegue automático a un VPS (por SSH) cada vez que se sube un cambio a la rama `dev`.
# Secretos a crear en GitHub (Settings > Secrets and variables > Actions):
#   VPS_HOST      dirección o IP del VPS
#   VPS_USER      usuario SSH
#   VPS_SSH_KEY   clave privada SSH (contenido completo) con acceso a ese usuario
#   VPS_PATH      carpeta de destino en el VPS (p. ej. /opt/sistema-solar)
#   VPS_PORT      (opcional) puerto SSH, por defecto 22
#   APP_PORT      (opcional) puerto del juego, por defecto 3000
# Requisitos en el VPS: Node 18+ y pm2 (npm i -g pm2). Las salas viven en memoria: al reiniciar se pierden las partidas abiertas.
name: Deploy dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PATH: ${{ secrets.VPS_PATH }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      APP_PORT: ${{ secrets.APP_PORT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Comprobar sintaxis de los scripts
        run: |
          for f in *.js; do node --check "$f"; done

      - name: Preparar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          : "${VPS_HOST:?Falta el secreto VPS_HOST}" "${VPS_USER:?Falta el secreto VPS_USER}" "${VPS_PATH:?Falta el secreto VPS_PATH}" "${VPS_SSH_KEY:?Falta el secreto VPS_SSH_KEY}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Subir archivos al VPS
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude '.github' --exclude 'node_modules' --exclude 'dist' \
            -e "ssh -i ~/.ssh/deploy_key -p ${VPS_PORT:-22}" \
            ./ "$VPS_USER@$VPS_HOST:$VPS_PATH/"

      - name: Instalar dependencias y reiniciar el servidor
        run: |
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" bash -s <<REMOTE
          set -e
          cd "$VPS_PATH"
          npm ci --omit=dev
          if pm2 describe sistema-solar >/dev/null 2>&1; then
            pm2 restart sistema-solar --update-env
          else
            PORT=${APP_PORT:-3000} pm2 start server.js --name sistema-solar
          fi
          pm2 save
          REMOTE
