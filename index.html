<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon-192.png"><meta name="theme-color" content="#050f1c">
<title>Sistema Solar Procedural</title>
<style>
  :root{--ink:#050f1c;--card:#12304d;--card2:#0d2338;--blue:#4db8ff;--orange:#ff9a3c;--green:#5dff8a;--yellow:#ffd23f;--txt:#e6f6ff;--dim:#8fb8d0}
  html,body{margin:0;height:100%;background:#010308;overflow:hidden;font:600 14px/1.35 ui-rounded,"Segoe UI Rounded","Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;color:var(--txt)}
  #stars{position:fixed;inset:0;width:100%;height:100%;display:block}
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #box{width:1080px;flex:none}
  /* tarjetas estilo "pegatina": borde grueso oscuro y sombra sólida abajo, como las teclas del menú */
  .card{background:linear-gradient(180deg,var(--card),var(--card2));border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink),inset 0 2px 0 #ffffff1c;padding:12px 14px}
  .card h3{margin:0 0 8px;font-size:12px;letter-spacing:.16em;color:var(--dim);display:flex;justify-content:space-between;align-items:center}
  .hdr{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .logo{font-size:24px;font-weight:900;letter-spacing:.08em;color:#fff;text-shadow:0 3px 0 var(--ink),0 0 18px #4db8ff88;white-space:nowrap}.logo small{display:block;font-size:11px;letter-spacing:.35em;color:var(--yellow);text-shadow:none;margin-top:-2px}
  .grow{flex:1;min-width:0}
  input[type=text]{width:100%;box-sizing:border-box;background:#06182a;border:3px solid var(--ink);border-radius:12px;color:#fff;padding:8px 11px;font:inherit;outline:none;box-shadow:inset 0 3px 0 #0008}
  input[type=text]:focus{border-color:var(--blue)}
  .btn{font:inherit;font-weight:900;letter-spacing:.1em;cursor:pointer;color:#fff;background:linear-gradient(180deg,#2c8fd6,#1a67a6);border:3px solid var(--ink);border-bottom-width:8px;border-radius:14px;padding:9px 16px;box-shadow:inset 0 2px 0 #ffffff40;text-shadow:0 2px 0 #0006;transition:.08s}
  .btn:hover:not(:disabled){filter:brightness(1.15)}.btn:active:not(:disabled){transform:translateY(4px);border-bottom-width:4px}
  .btn:disabled{filter:grayscale(.7) brightness(.7);cursor:not-allowed}
  .btn.go{background:linear-gradient(180deg,#ffa53f,#d9600f);width:100%;font-size:19px;padding:13px}
  .btn.green{background:linear-gradient(180deg,#3fdc78,#1c9a4e)}
  .btn.ghost{background:linear-gradient(180deg,#27506f,#1a3a54);padding:8px 12px}
  .btn.sm{padding:5px 10px;font-size:13px;border-bottom-width:6px}
  .code{background:#06182a;border:3px solid var(--ink);border-radius:12px;padding:5px 12px;letter-spacing:.1em;white-space:nowrap;box-shadow:inset 0 3px 0 #0008;color:var(--dim);font-size:12px}.code b{color:var(--yellow);font-size:18px;letter-spacing:.2em;margin-left:6px}
  .main{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:stretch}
  .left{position:relative;min-height:540px}
  #pv{position:absolute;left:10px;top:10px;width:calc(100% - 20px);height:calc(100% - 52px);border-radius:14px;display:block;cursor:grab;background:radial-gradient(circle at 50% 45%,#0e2a46,#03080f 78%);touch-action:none}
  #pv.drag{cursor:grabbing}
  .cap{position:absolute;left:10px;right:10px;bottom:10px;color:var(--dim);font-size:12px;text-align:center}
  .right{display:flex;flex-direction:column;gap:12px}
  .slots{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .slot{display:flex;align-items:center;gap:8px;background:#0a1e31;border:3px solid var(--ink);border-radius:14px;padding:5px 8px;min-width:0;animation:pop .3s ease-out}
  .slot.me{border-color:var(--green)}
  .slot.empty{background:transparent;border:3px dashed #2a5a78;color:#4d6f85;animation:pulse 2s infinite}
  .slot .nm{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.slot small{display:block;color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.slot .in{min-width:0}
  .av{width:42px;height:42px;flex:none;border-radius:50%;border:3px solid var(--ink);overflow:hidden;background:#fff;box-shadow:0 3px 0 var(--ink)}.av svg{display:block;width:100%;height:100%}
  .av.big{width:64px;height:64px}
  .slot.empty .av{background:transparent;border:3px dashed #2a5a78;box-shadow:none;display:flex;align-items:center;justify-content:center;font-size:20px}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);margin-right:4px;vertical-align:-1px}
  .cands{display:flex;gap:7px;margin-top:8px}.cands .av{cursor:pointer;width:38px;height:38px;transition:.1s}.cands .av:hover{transform:translateY(-3px)}.cands .av.on{border-color:var(--green);box-shadow:0 3px 0 var(--green)}
  .prof{display:flex;gap:10px;align-items:center}
  .stepper .btn{min-width:44px;padding:4px 12px;font-size:20px;line-height:1.1}.stepper{display:flex;align-items:center;gap:10px}.stepper b{font-size:26px;min-width:34px;text-align:center;color:#fff}
  .row{display:flex;gap:10px;align-items:center;justify-content:space-between}
  .chk{display:flex;gap:8px;align-items:center;margin-top:8px;color:#cfeaff;font-size:13px;cursor:pointer}.chk input{width:18px;height:18px;accent-color:var(--orange)}
  .err{color:var(--yellow);text-align:center;min-height:18px;font-size:13px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.opt{display:flex;flex-direction:column;gap:10px}.opt p{margin:0;color:var(--dim);font-size:13px;min-height:36px}.opt .btn.go{margin-top:auto}
  #inst{position:fixed;right:16px;bottom:14px;z-index:5;display:flex;gap:8px;align-items:center}#inst a{text-decoration:none;display:inline-block}
  .rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}.rgrid label{font-size:11px;color:var(--dim);display:flex;flex-direction:column;gap:2px}.rgrid input{width:100%;box-sizing:border-box;background:#06182a;border:3px solid var(--ink);border-radius:10px;color:#fff;padding:4px 6px;font:inherit;font-size:14px;outline:none}
  .wait{text-align:center;color:var(--dim);padding:14px}
  @keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}@keyframes pulse{50%{opacity:.55}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="app"><div id="box"></div></div>
<div id="inst"></div>
<script src="sysgen.js"></script>
<script src="menu.js"></script>
</body>
</html>
